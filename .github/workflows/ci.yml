name: DToxOut CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # --- Backend Pytest Suite ---
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libpq-dev

      - name: Install Python dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate Prisma Client
        run: |
          cd backend
          prisma generate

      - name: Run Backend Pytest Suite
        env:
          APP_ENV: testing
          JWT_SECRET_KEY: ci-testing-jwt-secret-key-1234567890-abcdef
          OCR_PROVIDER: mock
        run: |
          cd backend
          pytest app/tests/ --ignore=app/tests/test_http_verification.py -v

  # --- Frontend Vitest & Production Build ---
  frontend-tests-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Vitest Suite
        run: |
          cd frontend
          npm test -- --run

      - name: Build Production Frontend Assets
        run: |
          cd frontend
          npm run build

  # --- Docker Build Validation ---
  docker-validation:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests-and-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: dtoxout-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: dtoxout-frontend:test
